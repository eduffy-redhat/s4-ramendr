{{- if gt (len .Values.bootstrapBuckets) 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-read-deployments
subjects:
  - kind: ServiceAccount
    name: default
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: view
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s4-add-buckets
  labels:
    app: s4-add-buckets
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: s4-add-buckets
    spec:
      restartPolicy: Never
      initContainers:
        - name: install-roles
          image: quay.io/validatedpatterns/utility-container
          imagePullPolicy: IfNotPresent
          command: ["ansible-galaxy", "install", "-vr", "/pattern-home/requirements.yml"]
          volumeMounts:
            - name: playbook
              mountPath: /pattern-home
            - name: dependencies
              mountPath: /pattern-home/.ansible
        ## Wait for at least one controller to be ready -- a controller must be running for satellite to register with
        - name: wait-for-controller
          image: bitnami/kubectl
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -exc
            - |
              kubectl wait --for=condition=Available deployment {{ include "s4.fullname" . }} --timeout=300s
      containers:
        - name: ansible-runner
          image: quay.io/validatedpatterns/utility-container
          imagePullPolicy: IfNotPresent
          command: ["ansible-playbook", "-vvv", "/pattern-home/playbook.yml"]
          env:
            - name: S4_ENDPOINT_ADDRESS
              value: "s4-s3.apps.eduffy-2026-04-08.fusionaccess.devcluster.openshift.com"
            - name: S4_ENDPOINT_PORT
              value: "80"
            - name: S4_ENDPOINT_PROTOCOL
              value: "http"
            - name: S4_ENDPOINT_USER
              valueFrom:
                secretKeyRef:
                  name: s4-credentials
                  key: username
            - name: S4_ENDPOINT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: s4-credentials
                  key: password
          volumeMounts:
            - name: playbook
              mountPath: /pattern-home
            - name: dependencies
              mountPath: /pattern-home/.ansible
      volumes:
        - name: playbook
          configMap:
            name: s4-playbook
        - name: dependencies
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s4-playbook
data:
  playbook.yml: |
    ---
    - name: Add Requisite Buckets to the S4 Server
      become: false
      connection: local
      hosts: localhost
      gather_facts: false
      roles:
        - role: s4
          s4_s4:
            endpointAddress: "{{ "{{" }} lookup('ansible.builtin.env', 'S4_ENDPOINT_ADDRESS') {{ "}}" }}"
            endpointPort: "{{ "{{" }} lookup('ansible.builtin.env', 'S4_ENDPOINT_PORT') {{ "}}" }}"
            endpointProtocol: "{{ "{{" }} lookup('ansible.builtin.env', 'S4_ENDPOINT_PROTOCOL') {{ "}}" }}"
            endpointUser: "{{ "{{" }} lookup('ansible.builtin.env', 'S4_ENDPOINT_USER') {{ "}}" }}"
            endpointPassword: "{{ "{{" }} lookup('ansible.builtin.env', 'S4_ENDPOINT_PASSWORD') {{ "}}" }}"
          s4_buckets:
            {{- range .Values.bootstrapBuckets }}
            - {{ . }}
            {{- end }}
  requirements.yml: |
    roles:
      # Role from a private Git repository
      - src: https://github.com/eduffy-redhat/s4-role.git
        scm: git
        version: main
        name: s4
    collections:
      # The standard collection for AWS resources
      - name: amazon.aws
---
apiVersion: v1
kind: Secret
metadata:
  name: s4-credentials
type: Opaque
stringData:
  username: s4admin
  password: s4secret
{{- end }}
